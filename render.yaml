# Render.com blueprint for the MarketPulse backend API.
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
# The frontend deploys separately on Vercel (see frontend/vercel.json).
services:
  - type: web
    name: marketpulse-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Secrets: set these in the Render dashboard (Environment tab), never here.
      - key: GEMINI_API_KEY
        sync: false
      - key: PRISMTRACE_API_KEY
        sync: false
      - key: PRISMTRACE_PROJECT_ID
        sync: false
      # After Vercel assigns the frontend URL, add it here as CORS_ORIGINS,
      # e.g. https://marketpulse.vercel.app,http://localhost:5173
      - key: CORS_ORIGINS
        sync: false
